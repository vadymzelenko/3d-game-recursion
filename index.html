<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>РЕКУРСИЯ: ОБЪЕКТ-1988</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Oswald:wght@300;400;500;600&family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/ui.css" />
  <link rel="stylesheet" href="css/terminal.css" />

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<canvas id="game"></canvas>

<!-- HUD: всё, что поверх мира во время игры -->
<div id="hud" class="hidden">
  <div id="crosshair"></div>
  <div id="location"><span class="loc-room"></span></div>
  <div id="prompt"></div>
  <div id="caption"><div class="cap-who"></div><div class="cap-text"></div></div>
  <div id="toasts"></div>
  <div id="click-hint" class="hidden">Щёлкните мышью, чтобы вернуться</div>
</div>

<!-- Карточка акта -->
<div id="act-card" class="hidden">
  <div class="act-num"></div>
  <div class="act-title"></div>
  <div class="act-epigraph"></div>
</div>

<!-- Слой для окон: документы, тетрадь, головоломки, меню -->
<div id="overlay-root"></div>

<!-- Терминал «Искра-1030» -->
<div id="terminal" class="hidden"></div>

<!-- Затемнение для переходов -->
<div id="fade"></div>

<!-- Титульный экран -->
<div id="title-screen">
  <div class="title-box">
    <div class="title-pre">ВЦ «ПРИБОР» · 14.11.1988 · 04:12</div>
    <h1>РЕКУРСИЯ</h1>
    <h2>ОБЪЕКТ-1988</h2>
    <p class="title-tag">Записки младшего инженера А.&nbsp;В.&nbsp;Морозова</p>
    <div class="title-menu">
      <button id="btn-continue" class="hidden">Продолжить</button>
      <button id="btn-new">Новая игра</button>
    </div>
    <div class="title-loading">загрузка шрифтов…</div>
    <div class="title-controls">
      <span><b>WASD</b> ход</span><span><b>Мышь</b> взгляд</span>
      <span><b>E</b> действие</span><span><b>Tab</b> тетрадь</span><span><b>Esc</b> пауза</span>
    </div>
    <div class="title-note">Лучше в наушниках. Игра сохраняется сама.</div>
  </div>
</div>

<!-- CRT-эффекты поверх всего -->
<div id="vignette"></div>
<div id="grain"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
